<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- The market's down (2.33): a sad face in a chipped ring, in dimmer, cooler silver. -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F5FB"/>
      <stop offset="0.55" stop-color="#C3C8D4"/>
      <stop offset="1" stop-color="#8A91A2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feFlood flood-color="#DCE6FF" flood-opacity="0.38"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="url(#silver)">
    <!-- the ring, thicker towards the lower left, cracked through at the upper right -->
    <path d="M60.81,34.37 A33.8,33.8 0 1 1 53.75,30.12 L56.45,33.12 L54.26,33.54 A29.1,29.1 0 1 0 58.6,36.16 L57.39,33.69 Z"/>
    <!-- the eyes, drooping at their outer ends, and the mouth, downturned -->
    <path fill="none" stroke="url(#silver)" stroke-width="3.6" stroke-linecap="round" d="M26.6,62.6 Q30,54.2 35.8,58.2"/>
    <path fill="none" stroke="url(#silver)" stroke-width="3.6" stroke-linecap="round" d="M44.2,58.2 Q50,54.2 53.4,62.6"/>
    <path fill="none" stroke="url(#silver)" stroke-width="3.6" stroke-linecap="round" d="M30.2,77.2 Q40,64.2 49.8,77.2"/>
  </g>
</svg>
