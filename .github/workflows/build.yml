name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle not found - the project files were not uploaded."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Assemble debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp "${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk" "${{ env.APP_DIR }}/Worldly.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Worldly
          path: ${{ env.APP_DIR }}/Worldly.apk
