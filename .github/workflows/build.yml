name: Build APK
# Builds Worldly on every push (and on demand from the Actions tab). Every run uploads Worldly.apk
# as an artifact. Runs on main that are signed with the fixed key also publish it to the "latest"
# release, which gives a stable download link that always has the newest build:
# https://github.com/daveroz/Worldly/releases/download/latest/Worldly.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK on the release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Locate project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle not found - the project files were not uploaded."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The repository secret SIGNING_KEYSTORE_BASE64 holds the signing key (see README.md).
      # Without it the APK is signed with a throwaway key, so it can't install over an existing one.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_WITH_FIXED_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::The SIGNING_KEYSTORE_BASE64 secret isn't set, so this APK is signed with a throwaway key and won't be published to the release. See README.md."
          fi

      - name: Assemble release APK
        working-directory: ${{ env.APP_DIR }}
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp "${{ env.APP_DIR }}/app/build/outputs/apk/release/app-release.apk" Worldly.apk

      - name: Show version and signing key
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" "${{ env.APP_DIR }}/app/build.gradle")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "### Worldly $version"
            echo '```'
            "$apksigner" verify --print-certs Worldly.apk | grep 'SHA-256'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: Worldly.apk
          archive: false # download the APK itself, not a zip

      - name: Publish to the latest release
        if: env.SIGNED_WITH_FIXED_KEY == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Worldly $APP_VERSION"
          notes="Built from ${GITHUB_SHA::7}. Installs over the previous version (same signing key)."
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest Worldly.apk --clobber
            gh release edit latest --title "$title" --notes "$notes"
          else
            gh release create latest Worldly.apk --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
